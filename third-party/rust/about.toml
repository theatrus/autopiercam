# The order is intentional: when a dependency offers a choice, use the
# permissive license first so the generated bundle has the smallest complete
# set of obligations for the shipped binaries.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]

# AutoPierCam's supported Windows release target. cargo-about passes this to
# Cargo's platform filter before resolving the dependency graph.
targets = ["x86_64-pc-windows-msvc"]

# Build-script and test/tooling crates are not distributed in the release.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Crate-specific, checksum-backed clarifications follow. They are deliberately
# kept in this repository so a dependency update fails closed when upstream
# licensing files change.

# cargo-about's scanner does not recognize the indented license files shipped
# by windows-rs at the default confidence threshold. These checksum-backed
# clarifications preserve Microsoft's actual copyright notice instead of
# falling back to generic SPDX boilerplate. All listed windows-rs crates ship
# byte-identical license files.
[windows.clarify]
license = "MIT OR Apache-2.0"

[[windows.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

[[windows.clarify.files]]
path = "license-apache-2.0"
license = "Apache-2.0"
checksum = "c16f8dcf1a368b83be78d826ea23de4079fe1b4469a0ab9ee20563f37ff3d44b"

