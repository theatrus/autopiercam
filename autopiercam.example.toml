[camera]
# camera_id = 0
# name_contains = "ASI676MC"
bin = 1
min_exposure_us = 100
max_exposure_us = 5000000
max_gain = 300
target_brightness = 100
settle_frames = 6

[capture]
directory = "captures"
interval_ms = 10000
jpeg_quality = 88
writer_queue_capacity = 2
keep_latest = true
retention_days = 14

[upload]
# Upload starts only after a JPEG is flushed, synced, and atomically published.
# The current queue is best-effort and process-local; files remain on disk when
# the queue is full or delivery fails.
enabled = false
# PUT uses this endpoint after standard URL normalization; no filename is
# appended and redirects are off.
# Use HTTPS. Bearer authentication requires it.
# endpoint = "https://example.test/camera/latest"
# This is the name of an environment variable, not the token itself.
# bearer_token_env = "AUTOPIERCAM_UPLOAD_TOKEN"
# Enqueue is nonblocking; capacity must be positive. Pending entries are not
# recovered after restart yet.
queue_capacity = 32

[video]
enabled = false
segment_seconds = 300
frames_per_second = 4

[api]
listen = "127.0.0.1:4762"
