[camera]
# Both backends run in the isolated Regain worker. No automatic SDK fallback.
driver = "zwo_sdk"
# driver = "zwo_direct" # Experimental; ASI662MC/ASI676MC, bin 1, max 2,000 s.
# serial = "exact-camera-serial" # Required to distinguish identical models.
# camera_id = 0
# name_contains = "ASI676MC"
bin = 1
min_exposure_us = 100
# Auto exposure adapts up to 60 seconds; the effective cap depends on the camera.
max_exposure_us = 60000000
max_gain = 300
# Regain always uses AutoPierCam's application exposure controller.
exposure_control = "adaptive"
# min_gain = 200
# prefer_short_exposures = true
# Set min_gain = max_gain for fixed gain with automatic exposure.
target_brightness = 100
settle_frames = 6
# Optional observing location (degrees north/east; west and south are negative).
# Set BOTH to select startup day/night from UTC and solar altitude. No geolocation/network.
# latitude_deg = 40.0
# longitude_deg = -120.0
# Night begins below -6 degrees (civil twilight). Startup exposure is 1 s at night,
# 10 ms by day, clamped to your limits; frame feedback takes over afterward.
# Changes apply at the next capture start; blank preserves legacy startup behavior.

# Optional Regain WB for BOTH drivers. Omit to preserve unmanaged backend defaults.
# Linear red/blue multipliers relative to green=1, range 0.125..8 (not SDK values).
# White balance affects previews AND saved images, including 16-bit PNGs.
# white_balance = { mode = "manual", red = 1.0, blue = 1.0 }
# Modes: manual, once (new estimate per session), continuous. Changes restart capture.
# AWB assumes a neutral scene; use manual gains for strongly colored/narrowband skies.

[capture]
directory = "captures"
interval_ms = 10000
# Maximum preview FPS (1..30). Pace short exposures; longer exposures stay live.
preview_max_fps = 2
jpeg_quality = 88
writer_queue_capacity = 2
keep_latest = true
retention_days = 14

[upload]
# Upload starts only after a JPEG is flushed, synced, and atomically published.
# Intents and retry deadlines persist in <config-name>.upload.sqlite3 beside
# this file. Its first transaction inventories existing generated names so
# they are never adopted as history. The uploader never deletes the local JPEG.
enabled = false
# PUT uses this endpoint after standard URL normalization; no filename is
# appended and redirects are off. An existing ledger is bound to this exact
# normalized endpoint, the canonical capture directory above, and a one-way
# fingerprint of the active authorization identity.
# Use HTTPS. Bearer authentication requires it.
# endpoint = "https://example.test/camera/latest"
# This is the name of an environment variable, not the token itself. A token
# can rotate only after no upload remains pending, active, or retrying and no
# finalized crash-gap JPEG is waiting to be reconciled.
# bearer_token_env = "AUTOPIERCAM_UPLOAD_TOKEN"
# Capacity must be positive and bounds only coalesced worker wake hints. SQLite
# owns the durable queue, so a full wake channel does not lose an intent.
queue_capacity = 32

[video]
enabled = false
segment_seconds = 300
frames_per_second = 4

[api]
listen = "127.0.0.1:4762"
