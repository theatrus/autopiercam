[workspace]
members = [
    "crates/autopiercam",
    "crates/autopiercam-camera",
    "crates/autopiercam-regain-worker",
    "crates/autopiercam-chatstronomy",
    "crates/autopiercam-core",
    "crates/autopiercam-protocol",
    "crates/autopiercam-tray",
    "crates/autopiercam-vision",
]
resolver = "3"

[workspace.package]
version = "0.2.17"
edition = "2024"
authors = ["Yann Ramin"]
description = "Unattended capture, monitoring, and upload tools for ZWO ASI planetary cameras"
homepage = "https://github.com/theatrus/autopiercam"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/theatrus/autopiercam"
rust-version = "1.89"

[workspace.dependencies]
regain-core = { git = "https://github.com/pulsarfab/regain", rev = "f0c91226523fe447da5724c7bd547e2b3a24b2d0" }
regain-transport = { git = "https://github.com/pulsarfab/regain", rev = "f0c91226523fe447da5724c7bd547e2b3a24b2d0" }
regain-zwo = { git = "https://github.com/pulsarfab/regain", rev = "f0c91226523fe447da5724c7bd547e2b3a24b2d0", default-features = false, features = ["asi-sdk", "asi-direct"] }
anyhow = "1.0.100"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
ctrlc = "3.5.2"
embed-resource = "3.0.5"
fs4 = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
getrandom = "0.4.3"
libloading = "0.9.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["io-util", "net", "rt", "time", "sync", "macros"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
ureq = { version = "3.4.0", default-features = false, features = ["platform-verifier", "rustls"] }
url = "2.5.8"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
