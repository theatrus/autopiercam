[workspace]
members = [
    "crates/autopiercam",
    "crates/autopiercam-asi",
    "crates/autopiercam-core",
    "crates/autopiercam-protocol",
    "crates/autopiercam-tray",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Yann Ramin"]
description = "Unattended capture, monitoring, and upload tools for ZWO ASI planetary cameras"
homepage = "https://github.com/theatrus/autopiercam"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/theatrus/autopiercam"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive", "env"] }
ctrlc = "3.5.2"
fs4 = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
getrandom = "0.4.3"
libloading = "0.9.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["io-util", "net", "rt", "time"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
ureq = { version = "3.4.0", default-features = false, features = ["platform-verifier", "rustls"] }
url = "2.5.8"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
