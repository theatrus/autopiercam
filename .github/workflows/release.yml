# Build, sign and publish the Windows installer.
#
# THE ORDER HERE IS THE WHOLE POINT. Build-Installer.ps1 splits deliberately
# into -StageOnly and -PackageOnly so signing can happen in the gap:
#
#   1. -StageOnly   build + stage + write approved-stage-manifest.json
#   2. sign         the four executables/DLLs the user actually runs
#   3. -PackageOnly wrap the now-signed payload into the MSI
#   4. sign         the MSI itself
#
# Signing only the MSI would ship a signed container full of unsigned programs.
# Signing before staging would not survive either -- packaging rewrites what it
# packages. The script's own comment says it: "Release signing belongs in this
# gap so users run signed programs, not only a signed container."
#
# The stage manifest enforces this rather than trusting it: -PackageOnly accepts
# a changed hash ONLY for a path in `signable_paths`, and throws for any other
# added, removed or altered file. So signing anything outside those four paths
# turns into a build failure, not a surprise in the shipped MSI.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release (off = build and sign only)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build, sign, publish
    runs-on: windows-latest
    # Load-bearing: must match the Entra federated credential subject
    # `repo:theatrus/autopiercam:environment:release`. Without it the OIDC
    # token carries a different subject and azure/login fails.
    environment: release
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # Cargo.toml is the source of truth; a tag that disagrees is a
          # mistake worth failing on, and Build-Installer.ps1 asserts it too.
          cargo_ver=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
                      | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)
          [[ "$cargo_ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid workspace version" >&2; exit 1; }
          test -f "docs/releases/$cargo_ver.md"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_ver="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag_ver" != "$cargo_ver" ]]; then
              echo "tag v$tag_ver does not match workspace version $cargo_ver" >&2
              exit 1
            fi
          fi
          echo "version=$cargo_ver" >> "$GITHUB_OUTPUT"
          echo "building $cargo_ver"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install WiX 6
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global wix --version 6.0.2
          wix --version
          wix extension add --global WixToolset.UI.wixext/6.0.2
          wix extension add --global WixToolset.Util.wixext/6.0.2
          wix extension list --global

      - name: Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-pc-windows-msvc
          cache-on-failure: true

      - name: Test and lint Rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked

      - name: Test N.I.N.A. and shared preview logic
        shell: bash
        run: dotnet test integrations/AutoPierCam.NINA/AutoPierCam.NINA.slnx --configuration Release

      - name: Test external H.264 encoder integration
        shell: pwsh
        run: |
          $env:AUTOPIERCAM_TEST_FFMPEG = ./scripts/Get-FFmpegForTests.ps1
          cargo test -p autopiercam video::tests --locked -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg integration tests failed.' }

      - name: Verify dependency license inventory
        shell: pwsh
        run: |
          # Frozen metadata resolves all targets, not only Windows.
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Fetching locked license inventory sources failed.' }
          cargo install cargo-about --version 0.9.1 --locked --features cli
          if ($LASTEXITCODE -ne 0) { throw 'Installing cargo-about failed.' }
          ./third-party/rust/Generate-Notices.ps1 -Check

      # ---- 1. build and stage --------------------------------------------
      - name: Stage the payload
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -Version ${{ steps.ver.outputs.version }} -StageOnly

      - name: Stage the N.I.N.A. plugin
        shell: pwsh
        run: ./integrations/AutoPierCam.NINA/build-nina-package.ps1 -Version '${{ steps.ver.outputs.version }}.0' -StageOnly

      # ---- 2. sign the programs -------------------------------------------
      # Failure at this step means the OIDC subject did not match the federated
      # credential; that is the most likely thing to be wrong. The signing
      # smoke test exercises exactly this in two minutes.
      - name: Authenticate to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Exactly the four installer signable paths and the separate plugin DLL.
      # `files` takes a newline-separated list of absolute paths. Do not switch
      # this to files-folder: it would also sign ASICamera2.dll and the .NET
      # runtime, and -PackageOnly rejects a changed hash on any non-signable
      # path.
      - name: Sign the staged programs
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\artifacts\installer\stage\autopiercam.exe
            ${{ github.workspace }}\artifacts\installer\stage\autopiercam-tray.exe
            ${{ github.workspace }}\artifacts\installer\stage\Viewer\AutoPierCam.Viewer.exe
            ${{ github.workspace }}\artifacts\installer\stage\Viewer\AutoPierCam.Viewer.dll
            ${{ github.workspace }}\integrations\AutoPierCam.NINA\artifacts\nina-plugin\package\AutoPierCam\AutoPierCam.NINA.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ---- 3. package the signed payload ----------------------------------
      - name: Package the MSI
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -Version ${{ steps.ver.outputs.version }} -PackageOnly

      - name: Package the signed N.I.N.A. plugin
        shell: pwsh
        run: ./integrations/AutoPierCam.NINA/build-nina-package.ps1 -Version '${{ steps.ver.outputs.version }}.0' -PackageOnly

      # ---- 4. sign the container ------------------------------------------
      - name: Sign the MSI
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\installer\output\AutoPierCam-${{ steps.ver.outputs.version }}-x64.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Assert what we shipped rather than assuming the steps above worked. A
      # signature that does not chain, or chains to the wrong publisher, should
      # fail the release and not reach anyone.
      - name: Verify every signature
        shell: bash
        run: |
          set -euo pipefail
          signtool=$(find "/c/Program Files (x86)/Windows Kits/10/bin" \
                       -name signtool.exe -path "*x64*" | sort | tail -1)
          echo "using: $signtool"
          stage="artifacts/installer/stage"
          fail=0
          for f in "$stage/autopiercam.exe" \
                   "$stage/autopiercam-tray.exe" \
                   "$stage/Viewer/AutoPierCam.Viewer.exe" \
                   "$stage/Viewer/AutoPierCam.Viewer.dll" \
                   "integrations/AutoPierCam.NINA/artifacts/nina-plugin/package/AutoPierCam/AutoPierCam.NINA.dll" \
                   "artifacts/installer/output/AutoPierCam-${{ steps.ver.outputs.version }}-x64.msi"; do
            echo "--- $f"
            if "$signtool" verify //pa //v "$f" > "$RUNNER_TEMP/v.txt" 2>&1; then
              if grep -q "StackFoundry LLC" "$RUNNER_TEMP/v.txt"; then
                echo "    OK  signed as StackFoundry LLC"
              else
                echo "    FAIL unexpected publisher"; cat "$RUNNER_TEMP/v.txt"; fail=1
              fi
            else
              echo "    FAIL not signed or does not chain"; cat "$RUNNER_TEMP/v.txt"; fail=1
            fi
          done
          test "$fail" = "0" || { echo "signature verification failed"; exit 1; }
          echo "all six artifacts signed and verified"

      - name: Validate the signed installer and installed lifecycle
        shell: pwsh
        run: |
          # Hosted Windows keeps checkout on D: and Local AppData on C:.
          # Preserve atomic, identity-checked archival on the user-data volume.
          $diagnostics = Join-Path $env:LOCALAPPDATA 'AutoPierCam-InstallerTests'
          "AUTOPIERCAM_LIFECYCLE_DIAGNOSTICS=$diagnostics" >> $env:GITHUB_ENV
          ./scripts/Test-InstallerPackage.ps1
          ./scripts/Test-InstalledAutoPierCam.ps1 -ArtifactParent $diagnostics

      - name: Prepare release assets and checksums
        shell: pwsh
        run: |
          ./scripts/Test-ReleaseAssets.ps1
          ./scripts/Stage-ReleaseAssets.ps1 -Version '${{ steps.ver.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: AutoPierCam-${{ steps.ver.outputs.version }}-release
          path: artifacts/release/*
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          # Never replace assets of an existing version. A retry uses a new
          # version if an earlier release has already been made public.
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "v$v" artifacts/release/* --target "$GITHUB_SHA" \
            --title "AutoPierCam $v" --notes-file "docs/releases/$v.md" --draft
          gh release edit "v$v" --draft=false

      - name: Preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-diagnostics-${{ github.run_id }}
          path: ${{ env.AUTOPIERCAM_LIFECYCLE_DIAGNOSTICS }}/lifecycle-test-*/**/*.log
          if-no-files-found: ignore
