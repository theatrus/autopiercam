name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    name: Windows capture, sharing and Viewer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: Swatinem/rust-cache@v2
      - name: Rust formatting, lint and tests (no physical camera)
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
      - run: dotnet build apps/AutoPierCam.Viewer/AutoPierCam.Viewer.csproj --configuration Release -p:Platform=x64
      - run: dotnet test integrations/AutoPierCam.NINA/AutoPierCam.NINA.slnx --configuration Release
      - run: dotnet test apps/AutoPierCam.Viewer.Tests --configuration Release
  portable:
    name: Portable client and security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p autopiercam-chatstronomy -p autopiercam-core -p autopiercam-protocol --locked
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
