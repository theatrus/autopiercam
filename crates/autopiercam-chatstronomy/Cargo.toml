[package]
name = "autopiercam-chatstronomy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Portable Chatstronomy client protocol and privacy boundaries"
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
anyhow.workspace = true
base64 = "0.23.1"
fs4.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
getrandom.workspace = true
image.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
sha2.workspace = true
tempfile.workspace = true
time = { version = "0.3", features = ["formatting"] }
tokio.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Credentials"] }
